<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude (Anthropic) colors</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      body { margin: 0; background: var(--surface-warm); color: var(--fg); font-family: var(--font-body); }
      main { min-height: 100vh; display: grid; place-items: center; padding: var(--space-6); }
      .frame { width: min(72vw, 810px); aspect-ratio: 3 / 4; background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); padding: var(--section-y-tablet); }
      h1 { margin: 0 0 var(--space-6); font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--leading-tight); }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
      .swatch { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; box-shadow: var(--elev-ring); }
      .color { height: 112px; background: var(--value); }
      .meta { padding: var(--space-3); color: var(--muted); font-size: var(--text-xs); line-height: 1.3; }
      strong { display: block; color: var(--fg); }
    </style>
  </head>
  <body>
    <main>
      <section class="frame">
        <h1>Color roles</h1>
        <div class="grid">
          <article class="swatch" style="--value: var(--bg)"><div class="color"></div><div class="meta"><strong>Background</strong>--bg</div></article>
          <article class="swatch" style="--value: var(--surface)"><div class="color"></div><div class="meta"><strong>Surface</strong>--surface</div></article>
          <article class="swatch" style="--value: var(--fg)"><div class="color"></div><div class="meta"><strong>Foreground</strong>--fg</div></article>
          <article class="swatch" style="--value: var(--muted)"><div class="color"></div><div class="meta"><strong>Muted</strong>--muted</div></article>
          <article class="swatch" style="--value: var(--border)"><div class="color"></div><div class="meta"><strong>Border</strong>--border</div></article>
          <article class="swatch" style="--value: var(--accent)"><div class="color"></div><div class="meta"><strong>Accent</strong>--accent</div></article>
        </div>
      </section>
    </main>
  </body>
</html>
