<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude (Anthropic) typography</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      body { margin: 0; background: var(--surface-warm); color: var(--fg); font-family: var(--font-body); }
      main { min-height: 100vh; display: grid; place-items: center; padding: var(--space-6); }
      .frame { width: min(72vw, 810px); aspect-ratio: 3 / 4; background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); padding: var(--section-y-desktop) var(--container-gutter-desktop); display: grid; align-content: center; gap: var(--space-5); }
      .eyebrow { margin: 0; color: var(--accent); font-size: var(--text-xs); letter-spacing: 0.04em; text-transform: uppercase; }
      h1 { margin: 0; font-family: var(--font-display); font-size: var(--text-4xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-display); }
      .subtitle { margin: 0; color: var(--fg-2); font-size: var(--text-lg); line-height: var(--leading-body); }
      .caption { margin: 0; color: var(--muted); font-size: var(--text-base); line-height: var(--leading-body); }
    </style>
  </head>
  <body>
    <main>
      <section class="frame">
        <p class="eyebrow">3:4 video typography</p>
        <h1>Display sample for Claude.</h1>
        <p class="subtitle">Large subtitle text stays readable in a vertical frame.</p>
        <p class="caption">Metadata remains quiet while the serif title carries the scene.</p>
      </section>
    </main>
  </body>
</html>
