<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude (Anthropic) spacing</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      body { margin: 0; background: var(--surface-warm); color: var(--fg); font-family: var(--font-body); }
      main { min-height: 100vh; display: grid; place-items: center; padding: var(--space-6); }
      .frame { width: min(72vw, 810px); aspect-ratio: 3 / 4; background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); padding: var(--section-y-desktop) var(--container-gutter-desktop); }
      h1 { margin: 0 0 var(--space-6); font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--leading-tight); }
      .stack { display: grid; gap: var(--space-3); }
      .row { display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: var(--space-4); color: var(--muted); font-size: var(--text-xs); }
      .bar { height: var(--space-3); min-width: 2px; background: var(--accent); border-radius: var(--radius-pill); }
      .safe { margin-top: var(--space-8); border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: var(--space-4); color: var(--fg-2); font-size: var(--text-sm); line-height: var(--leading-body); }
    </style>
  </head>
  <body>
    <main>
      <section class="frame">
        <h1>Spacing and safe area</h1>
        <div class="stack">
          <div class="row"><span>--space-2</span><div class="bar" style="width: var(--space-2)"></div></div>
          <div class="row"><span>--space-4</span><div class="bar" style="width: var(--space-4)"></div></div>
          <div class="row"><span>--space-6</span><div class="bar" style="width: var(--space-6)"></div></div>
          <div class="row"><span>--space-8</span><div class="bar" style="width: var(--space-8)"></div></div>
          <div class="row"><span>--space-12</span><div class="bar" style="width: var(--space-12)"></div></div>
        </div>
        <p class="safe">3:4 scenes use generous edge insets so titles, subtitles, and overlays hold their place during motion.</p>
      </section>
    </main>
  </body>
</html>
