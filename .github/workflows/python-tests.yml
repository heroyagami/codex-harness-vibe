name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  remotion-template-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: vendor/auto-vibe/sceneFolder/pnpm-lock.yaml
      - name: Install template dependencies without browser postinstall
        working-directory: vendor/auto-vibe/sceneFolder
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck scene template
        working-directory: vendor/auto-vibe/sceneFolder
        run: pnpm run typecheck
      - name: Typecheck transition overlay
        shell: bash
        run: |
          rm -rf /tmp/transition-workspace
          cp -a vendor/auto-vibe/sceneFolder /tmp/transition-workspace
          rm -rf /tmp/transition-workspace/node_modules
          cp -a vendor/auto-vibe/transitionFolder/. /tmp/transition-workspace/
          ln -s "$GITHUB_WORKSPACE/vendor/auto-vibe/sceneFolder/node_modules" /tmp/transition-workspace/node_modules
          cd /tmp/transition-workspace
          pnpm run typecheck
