[budget]
max_total_cost_usd = 0.0
max_model_calls = 0
max_scene_attempts = 3
max_revision_attempts = 1

[production]
scene_concurrency = 3
transition_concurrency = 2
timeout_seconds = 900
require_visual_critic = true

[memory]
enabled = true
path = ""
max_examples_per_grammar = 3

[assets]
enabled = true
library_path = ""
max_assets_per_scene = 12

[quality]
max_freeze_seconds = 0.8
check_raster_jitter = true
delivery_render_concurrency = 1
beat_tolerance_seconds = 0.12
beat_tail_seconds = 0.5
require_sfx_checks_when_cues_exist = true

[alignment]
require_word_alignment = false
word_timestamps_file = "word-timestamps.json"

[video]
profile = "compact_3_4"
width = 1080
height = 1440
fps = 30

[safe_zone]
left = 110
right = 970
top = 145
content_bottom = 1000
subtitle_bottom = 1295
edge_guard = 60
