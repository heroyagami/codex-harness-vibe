# Copy this file and replace the command with the actual non-interactive CLI
# syntax supported by WorkBuddy, Qwen Code, or another coding agent.
# Supported placeholders: {cwd}, {model}, {prompt_file}, {response_file}, {schema_file}.

[models.scene_worker]
provider = "generic_cli"
model = "your-model"
command = [
  "your-agent",
  "run",
  "--cwd", "{cwd}",
  "--model", "{model}",
  "--prompt-file", "{prompt_file}",
  "--response-file", "{response_file}",
]
fallback_provider = "codex_worker"
fallback_model = ""
estimated_cost_usd = 0.0

